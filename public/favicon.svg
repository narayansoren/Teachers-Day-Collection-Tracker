<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="bloomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#881337" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Soft Background Tile -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  <rect width="60" height="60" x="2" y="2" rx="16" stroke="#fecdd3" stroke-width="1.5" fill="none" />

  <!-- Botanical Leaf Accents -->
  <path d="M43 45 C49 41 54 42 56 48 C56 54 49 53 42 48 Z" fill="url(#leafGrad)" />
  <path d="M21 45 C15 41 10 42 8 48 C8 54 15 53 22 48 Z" fill="url(#leafGrad)" />

  <!-- Main Flower Emblem -->
  <g filter="url(#bloomShadow)">
    <!-- Outer Layer Petals -->
    <circle cx="32" cy="20" r="10" fill="url(#petalGrad1)" />
    <circle cx="42" cy="27" r="10" fill="url(#petalGrad2)" />
    <circle cx="38" cy="39" r="10" fill="url(#petalGrad1)" />
    <circle cx="26" cy="39" r="10" fill="url(#petalGrad2)" />
    <circle cx="22" cy="27" r="10" fill="url(#petalGrad1)" />

    <!-- Center Blossom Glow -->
    <circle cx="32" cy="30" r="11" fill="#fff" />
    <circle cx="32" cy="30" r="9.5" fill="url(#petalGrad1)" />

    <!-- Inner Heart of Gratitude -->
    <path d="M32 36.5 C32 36.5 26 31.8 26 27.5 C26 25 28 23 30.5 23 C31.7 23 32 23.7 32 23.7 C32 23.7 32.3 23 33.5 23 C36 23 38 25 38 27.5 C38 31.8 32 36.5 32 36.5 Z" fill="#ffffff" />
    <path d="M32 35 C32 35 27.2 31 27.2 27.5 C27.2 25.5 28.8 23.8 30.7 23.8 C31.8 23.8 32 24.5 32 24.5 C32 24.5 32.2 23.8 33.3 23.8 C35.2 23.8 36.8 25.5 36.8 27.5 C36.8 31 32 35 32 35 Z" fill="url(#goldGrad)" />

    <!-- Sparkle Stars -->
    <polygon points="17,13 18,15 20,16 18,17 17,19 16,17 14,16 16,15" fill="url(#goldGrad)" />
    <polygon points="47,13 48,15 50,16 48,17 47,19 46,17 44,16 46,15" fill="url(#goldGrad)" />
  </g>
</svg>